name: kriyalink
description: KriyaLink - Menghubungkan UMKM Indonesia dengan desainer kreatif untuk branding.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Styling
  google_fonts: ^6.0.0
  flutter_animate: ^4.0.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # State Management
  flutter_riverpod: ^2.5.0

  # Firebase
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_auth: ^5.0.0

  # AI
  google_generative_ai: ^0.4.0

  # Utilities
  image_picker: ^1.2.4
  url_launcher: ^6.2.0
  share_plus: ^9.0.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
